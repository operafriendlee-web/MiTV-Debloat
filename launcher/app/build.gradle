plugins {
    id 'com.android.application'
}

// Release signing: one fixed key, so every build (CI or any computer) upgrades the last one in
// place and the TV keeps the launcher's settings. The key comes from environment variables (CI
// secrets) or launcher/keystore.properties (git-ignored; see docs/development.md). Without it,
// release builds fall back to this computer's debug key, as before.
def keyProps = new Properties()
def keyPropsFile = rootProject.file('keystore.properties')
if (keyPropsFile.exists()) keyPropsFile.withInputStream { keyProps.load(it) }
def signing = { String env, String prop -> System.getenv(env) ?: keyProps.getProperty(prop) }
def releaseStore = signing('SIGNING_STORE_FILE', 'storeFile')

android {
    namespace 'my.rafhan.app.tvhome'
    compileSdk 36
    ndkVersion '28.2.13676358'

    defaultConfig {
        applicationId 'my.rafhan.app.tvhome'
        minSdk 26          // Android 8.0: the overlays, fonts and java.time need it; the Mi TV runs 10, the Mi Box 9
        targetSdk 36       // some Google TV 14 sets refuse old targets at install
        versionCode 33
        versionName '1.17.2'
        ndk { abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64' }
        // TV Home is English-only: leave out the libraries' translations.
        resourceConfigurations += ['en']
    }

    signingConfigs {
        release {
            if (releaseStore) {
                storeFile rootProject.file(releaseStore)
                storePassword signing('SIGNING_STORE_PASSWORD', 'storePassword')
                keyAlias signing('SIGNING_KEY_ALIAS', 'keyAlias')
                keyPassword signing('SIGNING_KEY_PASSWORD', 'keyPassword')
            }
        }
    }

    buildTypes {
        // What build-and-install.sh installs and GitHub Releases publish: R8-shrunk code and
        // resources, signed with the release key when there is one (see the top of this file).
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig releaseStore ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    // The Net traffic engine (src/main/cpp) is built for every CPU type but kept out of the APK, so
    // TV Home stays small: the NetEngine task below copies it out and records each file's SHA-256,
    // and the app downloads and checks it the first time the monitor starts (TrafficEngine.java).
    packaging {
        jniLibs { excludes += ['**/libzdtun.so', '**/libtraffic.so'] }
        // Kotlin's reflection metadata and coroutine debug probes (from dadb): nothing reads them.
        resources { excludes += ['**/*.kotlin_builtins', 'DebugProbesKt.bin', 'META-INF/androidx/**/LICENSE.txt'] }
    }
    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    testOptions {
        // Unit tests read a stubbed android.jar; the pure classes they exercise never call into it.
        unitTests.returnDefaultValues = true
    }
}

/**
 * Copies the Net traffic engine's libraries to build/outputs/netengine/<variant>/ as
 * netengine-<abi>-<lib> (what CI attaches to a release and build-and-install.sh pushes to the TV),
 * and writes netengine.txt into the APK's assets: "<abi> <lib> <sha256>" a line. The app loads
 * only files matching those fingerprints.
 */
abstract class NetEngine extends DefaultTask {
    @InputFiles abstract ConfigurableFileCollection getLibs()
    @Input abstract ListProperty<String> getAbis()
    @Input abstract Property<String> getConfig()
    @OutputDirectory abstract DirectoryProperty getEngineDir()
    @OutputDirectory abstract DirectoryProperty getAssetsDir()

    @TaskAction
    void run() {
        File out = engineDir.get().asFile
        out.deleteDir()
        out.mkdirs()
        List<String> lines = []
        abis.get().each { abi ->
            ['libzdtun.so', 'libtraffic.so'].each { lib ->
                File f = libs.files.findAll {
                    it.name == lib && it.parentFile.name == abi && it.path.contains("/${config.get()}/")
                }.max { it.lastModified() }
                if (f == null) throw new GradleException("Net traffic engine: ${abi}/${lib} wasn't built")
                byte[] bytes = f.bytes
                new File(out, "netengine-${abi}-${lib}").bytes = bytes
                lines << "${abi} ${lib} ${java.security.MessageDigest.getInstance('SHA-256').digest(bytes).encodeHex()}"
            }
        }
        File assets = assetsDir.get().asFile
        assets.mkdirs()
        new File(assets, 'netengine.txt').text = lines.join('\n') + '\n'
    }
}

androidComponents {
    onVariants(selector().all()) { variant ->
        String name = variant.name.capitalize()
        def engine = tasks.register("netEngine${name}", NetEngine) {
            dependsOn "externalNativeBuild${name}"
            libs.from(fileTree(layout.buildDirectory.dir('intermediates/cxx')) { include '**/obj/*/lib*.so' })
            abis.set(['armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'])
            config.set(variant.buildType == 'release' ? 'RelWithDebInfo' : 'Debug')
            engineDir.set(layout.buildDirectory.dir("outputs/netengine/${variant.name}"))
        }
        variant.sources.assets?.addGeneratedSourceDirectory(engine) { it.assetsDir }
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    // Used directly by the launcher (ContextCompat and FileProvider, NonNull) but only pulled in
    // through RecyclerView. Declared here so the app doesn't break if RecyclerView stops
    // depending on them. Core stays at the version RecyclerView picks: 1.19 needs Android Gradle
    // plugin 9 (app/lint.xml).
    implementation 'androidx.core:core:1.13.0'
    implementation 'androidx.annotation:annotation:1.11.0'
    // Loopback ADB client for the phone remote (D-pad and typing in any app while USB debugging is on).
    implementation 'dev.mobile:dadb:1.2.10'

    testImplementation 'junit:junit:4.13.2'
    // Android's own org.json is only a stub in local unit tests; the real one (same API) for WeatherTest.
    testImplementation 'org.json:json:20260814'
}
